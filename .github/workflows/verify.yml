name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install YAML parser for the proof helpers
        run: pip install pyyaml
      - name: Run every offline verify and self-test lane
        run: npm run verify

  # The cub sveltos plugin: its tests hold the committed onboarding example
  # to what the code writes, so the example can never drift from the tool.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
