apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: sveltos-kyverno
  labels:
    sveltos.confighub.com/profile: kyverno
spec:
  resourceSelectors:
    - group: apps
      version: v1
      kind: Deployment
      namespace: kyverno
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.resources = {}
      local delivered = {
        ["Deployment/kyverno/kyverno-admission-controller"] = true,
        ["Deployment/kyverno/kyverno-background-controller"] = true,
        ["Deployment/kyverno/kyverno-cleanup-controller"] = true,
        ["Deployment/kyverno/kyverno-reports-controller"] = true,
      }
      for _, obj in ipairs(resources) do
        if delivered[obj.kind .. "/" .. (obj.metadata.namespace or "") .. "/" .. obj.metadata.name] then
          local status, message = "Healthy", ""
          if obj.kind == "Deployment" then
            local want = obj.spec.replicas or 1
            local st = obj.status or {}
            if (st.observedGeneration or 0) < (obj.metadata.generation or 0) or (st.updatedReplicas or 0) < want then
              status, message = "Progressing", obj.metadata.name .. ": rolling out"
            elseif (st.availableReplicas or 0) < want then
              status, message = "Degraded", obj.metadata.name .. ": " .. (st.availableReplicas or 0) .. " of " .. want .. " available"
            end
          end
          table.insert(hs.resources, {resource = obj, status = status, message = message})
        end
      end
      return hs
    end
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: ClusterHealthCheck
metadata:
  name: sveltos-kyverno
  labels:
    sveltos.confighub.com/profile: kyverno
spec:
  clusterSelector:
    matchExpressions:
      - key: env
        operator: In
        values:
          - staging
          - prod
  livenessChecks:
    - name: workloads
      type: HealthCheck
      livenessSourceRef:
        apiVersion: lib.projectsveltos.io/v1beta1
        kind: HealthCheck
        name: sveltos-kyverno
  notifications:
    - name: events
      type: KubernetesEvent
