apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: confighub-sveltos-kyverno-policies-staging-eu
spec:
  clusterRefs:
    - apiVersion: lib.projectsveltos.io/v1beta1
      kind: SveltosCluster
      namespace: mgmt
      name: mgmt
  policyRefs:
    - deploymentType: Remote
      remoteURL:
        url: oci://oci.hub.confighub.com/space/sveltos-kyverno-policies-staging-eu:latest
        interval: 1m0s
        secretRef:
          name: confighub-sveltos-targets
          namespace: projectsveltos
---
