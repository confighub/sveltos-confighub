apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kyverno-staging-eu
  labels:
    sveltos.confighub.com/variant: sveltos-kyverno-staging-eu
spec:
  clusterRefs:
    - apiVersion: lib.projectsveltos.io/v1beta1
      kind: SveltosCluster
      namespace: projectsveltos
      name: staging-eu
  syncMode: ContinuousWithDriftDetection
  continueOnError: true
  policyRefs:
    - deploymentType: Remote
      remoteURL:
        url: oci://oci.hub.confighub.com/space/sveltos-kyverno-staging-eu:latest
        interval: 1m0s
        secretRef:
          name: confighub-sveltos-targets
          namespace: projectsveltos
  validateHealths:
    - name: deployments-kyverno
      featureID: Resources
      group: apps
      version: v1
      kind: Deployment
      namespace: kyverno
      script: |
        function evaluate()
          hs = {}
          hs.healthy = true
          hs.message = ""
          local delivered = { ["kyverno-admission-controller"] = true, ["kyverno-background-controller"] = true, ["kyverno-cleanup-controller"] = true, ["kyverno-reports-controller"] = true }
          if delivered[obj.metadata.name] then
            local want = obj.spec.replicas or 1
            local status = obj.status or {}
            if (status.observedGeneration or 0) < (obj.metadata.generation or 0) then
              hs.healthy = false
              hs.message = obj.metadata.name .. ": rolling out"
            elseif (status.updatedReplicas or 0) < want then
              hs.healthy = false
              hs.message = obj.metadata.name .. ": " .. (status.updatedReplicas or 0) .. " of " .. want .. " updated"
            elseif (status.availableReplicas or 0) < want then
              hs.healthy = false
              hs.message = obj.metadata.name .. ": " .. (status.availableReplicas or 0) .. " of " .. want .. " available"
            end
          end
          return hs
        end
---
