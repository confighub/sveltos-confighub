apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: ingress-nginx
spec:
  clusterSelector:
    matchLabels:
      env: prod
  syncMode: ContinuousWithDriftDetection
  helmCharts:
    - repositoryURL: https://kubernetes.github.io/ingress-nginx
      repositoryName: ingress-nginx
      chartName: ingress-nginx/ingress-nginx
      chartVersion: 4.15.1
      releaseName: ingress-nginx
      releaseNamespace: ingress-nginx
      helmChartAction: Install
---
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kyverno
spec:
  clusterSelector:
    matchExpressions:
      - key: env
        operator: In
        values: [staging, prod]
  syncMode: ContinuousWithDriftDetection
  helmCharts:
    - repositoryURL: https://kyverno.github.io/kyverno/
      repositoryName: kyverno
      chartName: kyverno/kyverno
      chartVersion: 3.8.1
      releaseName: kyverno
      releaseNamespace: kyverno
      helmChartAction: Install
      values: |
        admissionController:
          replicas: 3
---
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: kyverno-policies
spec:
  clusterSelector:
    matchExpressions:
      - key: env
        operator: In
        values: [staging, prod]
  dependsOn: [kyverno]
  syncMode: ContinuousWithDriftDetection
  policyRefs:
    - kind: ConfigMap
      name: kyverno-policies
      namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno-policies
  namespace: default
data:
  disallow-latest-tag.yaml: |
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: disallow-latest-tag
    spec:
      background: true
      rules:
        - name: require-image-tag
          match:
            any:
              - resources:
                  kinds: [Pod]
          validate:
            failureAction: Audit
            message: "An image tag is required and must not be latest."
            pattern:
              spec:
                containers:
                  - image: "!*:latest"
