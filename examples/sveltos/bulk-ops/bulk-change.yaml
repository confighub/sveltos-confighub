apiVersion: catalog.confighub.com/v1alpha1
kind: SveltosBulkChangeCandidate
metadata:
  name: kyverno-background-controller-fleet-wide
spec:
  description: Raise the Kyverno background controller from two replicas to three on every fleet cluster in one reviewed fan-out.
  chart: kyverno/kyverno
  chartVersion: "3.8.2"
  valuesPath: backgroundController.replicas
  before: 2
  after: 3
  editedRecord: base
  fanOut:
    method: one reviewed edit made once on the base record and inherited by every per-cluster variant in one operation
    approvals: each per-cluster record still enforces its own approval gate
    selection:
      scope: cub unit list --space "*"
      whereTemplate: Labels.Proof = 'sveltos-bulk-ops' AND Labels.Run = '{run}' AND Labels.Wave = '1'
      baselineWhereTemplate: Labels.Proof = 'sveltos-bulk-ops' AND Labels.Run = '{run}' AND Labels.Record = 'variant'
      note: The whole fleet is one wave. The fan-out selects every variant with one query over the labels the records carry, so the operator acts once and ConfigHub still records one approval per cluster against that cluster's own exact revision.
  audit:
    gateQuery: Labels.Proof = 'sveltos-bulk-ops' AND LEN(ApplyGates) > 0
    gateQueryScope: cub unit list --space "*"
    driftObject: apps/v1/Deployment/kyverno/kyverno-background-controller
    claim: zero drift anywhere after the fan-out, with injected drift repaired on every cluster and no record changed out of band
