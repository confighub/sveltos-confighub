apiVersion: catalog.confighub.com/v1alpha1
kind: SveltosBulkOpsVariants
metadata:
  name: kyverno-bulk-variants
spec:
  base:
    profile: clusterprofile-base.yaml
    unit: clusterprofile
    space: sveltos-kyverno-bulk-base
    reachesCluster: false
    note: The base holds the reviewed content every cluster shares. It names no cluster, because its clusterRefs list is empty, it is given no target, and its Space is never published, so nothing reaches a cluster from the base itself.
  workloads:
    - cluster: hx-sveltos-env-pilot
      environment: pilot
      space: sveltos-kyverno-bulk-pilot
      departures:
        metadata.name: kyverno-bulk-hx-sveltos-env-pilot
        spec.clusterRefs:
        - apiVersion: lib.projectsveltos.io/v1beta1
          kind: SveltosCluster
          name: hx-sveltos-env-pilot
          namespace: projectsveltos
        spec.stopMatchingBehavior: WithdrawPolicies
    - cluster: hx-sveltos-env-staging
      environment: staging
      space: sveltos-kyverno-bulk-staging
      departures:
        metadata.name: kyverno-bulk-hx-sveltos-env-staging
        spec.clusterRefs:
        - apiVersion: lib.projectsveltos.io/v1beta1
          kind: SveltosCluster
          name: hx-sveltos-env-staging
          namespace: projectsveltos
        spec.stopMatchingBehavior: WithdrawPolicies
    - cluster: hx-sveltos-env-prod-a
      environment: prod
      space: sveltos-kyverno-bulk-prod-a
      departures:
        metadata.name: kyverno-bulk-hx-sveltos-env-prod-a
        spec.clusterRefs:
        - apiVersion: lib.projectsveltos.io/v1beta1
          kind: SveltosCluster
          name: hx-sveltos-env-prod-a
          namespace: projectsveltos
        spec.stopMatchingBehavior: LeavePolicies
    - cluster: hx-sveltos-env-prod-b
      environment: prod
      space: sveltos-kyverno-bulk-prod-b
      departures:
        metadata.name: kyverno-bulk-hx-sveltos-env-prod-b
        spec.clusterRefs:
        - apiVersion: lib.projectsveltos.io/v1beta1
          kind: SveltosCluster
          name: hx-sveltos-env-prod-b
          namespace: projectsveltos
        spec.stopMatchingBehavior: LeavePolicies
  management:
    cluster: hx-sveltos-env-mgmt
    space: sveltos-kyverno-bulk-mgmt
    holds: one bootstrap ClusterProfile per workload Space, each pointing at that Space on the ConfigHub OCI gateway
    appliedOutOfBandWith: kubectl
    reason: This record is what lets the management cluster fetch from the gateway, so its first revision cannot arrive through the gateway. It is applied once as cluster setup, and ConfigHub governs every revision after that under the same approval gate.
