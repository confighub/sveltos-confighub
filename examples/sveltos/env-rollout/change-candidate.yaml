apiVersion: catalog.confighub.com/v1alpha1
kind: SveltosEnvRolloutChange
metadata:
  name: kyverno-background-controller-replicas
spec:
  description: Raise the Kyverno background controller from one replica to two.
  chart: kyverno/kyverno
  chartVersion: "3.8.1"
  valuesPath: backgroundController.replicas
  before: 1
  after: 2
  editedRecord: base
  selection:
    scope: cub unit list --space "*"
    whereTemplate: Labels.Proof = 'sveltos-env-rollout' AND Labels.Run = '{run}' AND Labels.Environment = '{environment}'
    baselineWhereTemplate: Labels.Proof = 'sveltos-env-rollout' AND Labels.Run = '{run}' AND Labels.Record = 'variant'
    note: Each wave selects its variants with one query over the labels the records carry, so the operator acts once on a set and ConfigHub still records which cluster took which revision.
  waves:
    - wave: 1
      environment: pilot
      clusters:
        - hx-sveltos-env-pilot
    - wave: 2
      environment: staging
      clusters:
        - hx-sveltos-env-staging
    - wave: 3
      environment: prod
      clusters:
        - hx-sveltos-env-prod-a
        - hx-sveltos-env-prod-b
