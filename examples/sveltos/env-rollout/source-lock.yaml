apiVersion: catalog.confighub.com/v1alpha1
kind: SveltosEnvRolloutLock
metadata:
  name: env-rollout-prerequisites
spec:
  sveltos:
    version: v1.15.0
    manifestUrl: https://raw.githubusercontent.com/projectsveltos/sveltos/v1.15.0/manifest/manifest.yaml
    manifestSha256: ad80fa92a73b167e30df7a98cc0295acd3716b476dd0cc25859df3f45b69b4ce
    releasedControllerReadsGatewayLayers: true
    note: This chapter installs the released v1.15.0 manifest as published. The management cluster fetches each approved release from the ConfigHub OCI gateway itself, so no other controller takes part. The gateway serves each release as a gzipped tar layer, and the released addon controller now reads it itself. The fix for gzip-compressed and bsdtar-produced OCI RemoteURL layers (addon-controller #1911) and PlainHTTP support (#1913) shipped in v1.14.0, and v1.15.0 also carries #1929, the fix for a RemoteURL polling interval that blocked drift-detection reconciliation, which is this chapter's delivery pattern. So no image override is needed, the runner refuses one on this pin, and every receipt records the image its run used. The recordings made before this pin ran Sveltos v1.13.0 with docker.io/projectsveltos/addon-controller:v1.13.0-ch, a build carrying the gzip fix before it was released, and each of those receipts names that image.
    images: The runner preloads exactly the images the pinned manifest's own image lines name, so a release that adds a controller cannot be pulled from Docker Hub mid-lane. v1.15.0 names ten, all tagged v1.15.0 under docker.io/projectsveltos, register-mgmt-cluster among them. No sveltos-agent digest is recorded for v1.15.0, so each workload node pulls the agent directly, by the digest Sveltos deploys it with.
    managementRegistration: The manifest runs a register-mgmt-cluster Job that registers the management cluster as the SveltosCluster mgmt/mgmt with no labels, and the v1.13.0 manifest ran the same Job with the same arguments. The runner registers the management cluster itself as projectsveltos/management labelled role=management, and that is the cluster the bootstrap profiles select. The workload profiles name their own SveltosCluster in projectsveltos through clusterRefs, so no profile in this chapter selects mgmt/mgmt, and the Job's registration is left standing untouched.
