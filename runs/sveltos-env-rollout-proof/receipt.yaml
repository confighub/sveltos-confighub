  advance:
    evidenceGated: true
    rule: "No wave's approval is requested until the preceding checkpoint shows every cluster the wave depends on reporting healthy: the whole fleet at the baseline for wave one, the environment the previous wave promoted after that. Each wave records the evidence that unlocked it."
  changeManagement:
    component:
      slug: "sveltos-kyverno-env-rollout-20260926190447"
      id: "eadc5cea-400e-4242-933b-bc35c49033b5"
      label: "sveltos-kyverno-env-rollout"
      runScoped: true
      reason: "Recorded Spaces from earlier runs are kept on purpose, and a change order's scope is every Space attached to its base's component, so the component is per run: a component shared across runs would put an earlier run's variants in this change order's scope, where a promotion into a stage would reach them."
      spaces:
        - "hx-sveltos-env-base-20260926190447"
        - "hx-sveltos-env-pilot-20260926190447"
        - "hx-sveltos-env-staging-20260926190447"
        - "hx-sveltos-env-prod-a-20260926190447"
        - "hx-sveltos-env-prod-b-20260926190447"
    managementComponent:
      slug: "sveltos-kyverno-env-rollout-management-20260926190447"
      id: "aa9ef305-8913-4e19-ba70-8d923deb0c71"
      runScoped: true
      reason: "The management Space is not a variant of the base, and a change order's scope is every Space attached to its base's component, so the management Space has a run-scoped component of its own: it keeps a home in the component view and never sits in a change order's scope."
      spaces:
        - "hx-sveltos-env-mgmt-20260926190447"
    workflow:
      space: "hx-sveltos-env-base-20260926190447"
      slug: "rollout-20260926190447"
      ref: "hx-sveltos-env-base-20260926190447/rollout-20260926190447"
      file:
        path: "examples/sveltos/env-rollout/change-workflow.yaml"
        rawSha256: "e71920c8e21ce20ab825bdfd4d795fd28e3fa57e6c9766f3d3ad479aac077127"
      stages:
        - "pilot"
        - "staging"
        - "prod"
      stageSelector: "Labels.Stage = '<stage>' within the change order's component"
      prerequisites:
        - "Released"
      stageGates:
        -
          stage: "pilot"
          prerequisites:
            []
          releasePrerequisites:
            - "approval"
        -
          stage: "staging"
          prerequisites:
            - "Released"
          releasePrerequisites:
            - "approval"
        -
          stage: "prod"
          prerequisites:
            - "Released"
          releasePrerequisites:
            - "approval"
      attestationPrerequisites:
        -
          Name: "approval"
          Type: "Approval"
          Count: 1
          AllowAuthors: true
      separationOfDuties:
        allowAuthors: true
        relaxed: true
        statement: "This single-operator demo relaxes separation of duties: its approval requirement sets AllowAuthors: true, so the operator who promoted a change may also approve it. A production workflow sets AllowAuthors: false and has a second approver sign off, because ConfigHub counts whoever promoted a change into a Space as one of its authors there and does not count an author's approval."
        strictModeRefusal: "unable to publish a release of change order '<change-order>' in stage '<stage>': requires approval: 1 Approval attestation(s) from eligible attesters who did not write the change; <unit> revision <n> has 0 of 1"
        strictModeMeasuredOn: "2026-09-26"
      healthy:
        declared: false
        reason: "Healthy reads the confighub.com/live-status annotation and passes only on the literal words Synced, Succeeded and Healthy. Sveltos has no reporter that writes it yet (confighub/sveltos-confighub#33), and ConfigHub does not yet recognise the provider (confighubai/confighub#5049), so declaring it would hold every stage forever. Until both exist, the checkpoint evidence each wave records as unlockedBy is the observed-health layer."
      workflowRequired:
        component: "sveltos-kyverno-env-rollout-20260926190447"
        declared: true
        command: "cub component update --patch <component> --change-workflow-required --allowed-change-workflow <base-space>/<workflow>"
        enforcedOnPlainPublish: false
